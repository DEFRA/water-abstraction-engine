# Reference for all available properties
# https://sonarcloud.io/documentation/analysis/analysis-parameters/
# Reference for how to glob files
# https://docs.sonarqube.org/latest/project-administration/narrowing-the-focus/

# Project key is required. You'll find it in the SonarQube (formerly SonarCloud) UI
sonar.projectKey=DEFRA_water-abstraction-engine
sonar.organization=defra

# This is the name and version displayed in the SonarQube UI.
sonar.projectName=water-abstraction-engine

# This will add the same links in the SonarQube UI
sonar.links.homepage=https://github.com/DEFRA/water-abstraction-engine
sonar.links.ci=https://github.com/DEFRA/water-abstraction-engine/actions
sonar.links.scm=https://github.com/DEFRA/water-abstraction-engine
sonar.links.issue=https://github.com/DEFRA/water-abstraction-team/issues

# Path is relative to the sonar-project.properties file.

# SonarQube seems to have little intelligence when it comes to code coverage. Quite simply if it sees a code file, it
# checks it against our coverage report and if not found flags it as uncovered. This also effects the overall coverage
# score. In our case this means SonarQube could flag everything under test/ as lacking code coverage! We have found this
# combinations of `sources`, `tests` and `tests.inclusions` means SonarQube properly understands what is code and what
# is a test file. Note the use of ./ in `sources`. This is the only way we found to include root level files and ensure
# they are correctly resolved when SonarQube scans the lcov coverage data.
sonar.sources=src
sonar.exclusions=db/**,src/config/**,src/plugins/airbrake.plugin.js,src/plugins/auth.plugin.js,src/plugins/hapi-pino.plugin.js,src/plugins/stop.plugin.js,src/plugins/views.plugin.js,src/wrappers/**,src/base-server.js
sonar.tests=test
sonar.test.inclusions=test/**/*.js

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Ensure SonarQube knows where to pick up test coverage stats
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.issue.ignore.multicriteria=e1,e2,e3,e4
# Suppress S100 (function naming convention) for model files. Objection.js instance methods
# are conventionally prefixed with $ to distinguish them from static methods and plain properties.
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=src/models/**/*.js
# Suppress S138 (38: Functions should not have too many lines of code) for DAL files. DAL files often have to build
# large, chained objection queries or complex raw SQL. Breaking them up makes them less readable, not more.
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S138
sonar.issue.ignore.multicriteria.e2.resourceKey=src/dal/**/*.js
# Suppress S1541 (cyclomatic complexity) and S1067 (Expressions should not be too complex) for transactionsMatch() in
# general.lib.js. It's a flat chain of 13 equality checks with no nested branching; the team deliberately kept it this
# way after finding alternatives more complex and less performant (see the comment on the function).
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S1067
sonar.issue.ignore.multicriteria.e3.resourceKey=src/lib/general.lib.js
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S1541
sonar.issue.ignore.multicriteria.e4.resourceKey=src/lib/general.lib.js
